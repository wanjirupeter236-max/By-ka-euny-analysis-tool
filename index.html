<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BY KA EUNY Analysis Tool</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#070b14;
  color:#eef3ff
}
header{
  padding:16px;
  background:linear-gradient(135deg,#111a2d,#07101f);
  border-bottom:1px solid #24314d;
  position:sticky;
  top:0;
  z-index:5
}
h1{margin:0;font-size:20px}
.sub{color:#8fa3c7;font-size:12px;margin-top:5px}
#status{
  float:right;
  font-size:12px;
  padding:6px 9px;
  border-radius:12px;
  background:#38200e;
  color:#ffbd70
}
#status.ok{
  background:#0d3323;
  color:#65f0aa
}
main{
  padding:12px;
  max-width:1100px;
  margin:auto
}
.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:12px
}
button,select{
  background:#111a2d;
  color:#fff;
  border:1px solid #2c3c5c;
  border-radius:8px;
  padding:9px
}
button{cursor:pointer}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:10px
}
.card{
  background:#0e1525;
  border:1px solid #202d47;
  border-radius:12px;
  padding:12px;
  box-shadow:0 6px 18px #0004
}
.card h3{
  margin:0 0 8px;
  font-size:15px
}
.price{
  font-size:24px;
  font-weight:700
}
.muted{
  color:#8fa3c7;
  font-size:12px
}
.row{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin:7px 0;
  font-size:13px
}
.badge{
  padding:3px 7px;
  border-radius:8px;
  background:#18233a
}
.up{color:#57e7a3}
.down{color:#ff7d8a}
canvas{
  width:100%;
  height:110px;
  background:#080d18;
  border-radius:8px;
  margin-top:8px
}
#contracts{margin-top:12px}
.contract{
  display:inline-block;
  margin:4px;
  padding:7px 9px;
  border-radius:8px;
  background:#16213a;
  color:#bcd0f3;
  font-size:12px
}
.warning{
  color:#ffd28a;
  font-size:12px;
  margin:8px 0
}
</style>
</head>

<body>

<header>
  <span id="status">CONNECTING…</span>
  <h1>BY KA EUNY Analysis Tool</h1>
  <div class="sub">
    LIVE DERIV VOLATILITY • RSI • DIGITS • CONTRACT TYPES
  </div>
</header>

<main>

<div class="toolbar">

<select id="symbolSelect">
<option>Loading volatility indices…</option>
</select>

<button id="refresh">
Refresh Markets
</button>

<button id="pause">
Pause
</button>

</div>

<div class="warning">
Market data is live from Deriv's public WebSocket.
Analysis is informational and does not guarantee a winning trade.
</div>

<div id="cards" class="grid"></div>

<div id="contracts" class="card">

<h3>Available Contract Types</h3>

<div id="contractList" class="muted">
Select a volatility index.
</div>

</div>

</main>

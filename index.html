<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BY KA EUNY Analysis Tool</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#06101d;
  color:#fff;
  min-height:100vh;
}

.container{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:15px;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#09294a,#07111d);
  border:1px solid #174b72;
  border-radius:18px;
  padding:20px;
  text-align:center;
  box-shadow:0 0 25px rgba(0,150,255,.12);
}

.header h1{
  font-size:28px;
  color:#29a9ff;
  margin-bottom:7px;
}

.header p{
  color:#9ebbd0;
  font-size:14px;
}

/* CARDS */
.card{
  background:#0a1929;
  border:1px solid #183a55;
  border-radius:16px;
  padding:16px;
  margin-top:14px;
}

.card h2,
.card h3{
  margin-bottom:14px;
  color:#4db8ff;
}

/* INPUTS */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
}

label{
  display:block;
  font-size:13px;
  color:#9dbbd0;
  margin-bottom:6px;
}

input,
select{
  width:100%;
  padding:12px;
  background:#06111d;
  color:#fff;
  border:1px solid #28516d;
  border-radius:10px;
  outline:none;
}

input:focus,
select:focus{
  border-color:#20a7ff;
}

/* BUTTONS */
.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:13px;
}

button{
  padding:13px;
  border:none;
  border-radius:10px;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  background:#0877bd;
}

button:hover{
  background:#0b96ed;
}

.stop{
  background:#8c2632;
}

.stop:hover{
  background:#b72d3d;
}

/* STATUS */
.status{
  margin-top:12px;
  padding:11px;
  border-radius:10px;
  background:#07131f;
  text-align:center;
}

.live{
  color:#35ed91;
}

.offline{
  color:#ffbd55;
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.stat{
  background:#071521;
  border:1px solid #18364d;
  border-radius:12px;
  padding:15px 8px;
  text-align:center;
}

.stat small{
  color:#91afc3;
}

.stat strong{
  display:block;
  font-size:23px;
  margin-top:6px;
  color:#fff;
}

/* DIGITS */
.digits{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:7px;
}

.digitBox{
  background:#071521;
  border:1px solid #18364d;
  border-radius:10px;
  padding:10px 4px;
  text-align:center;
}

.digitBox span{
  color:#7fa3ba;
  font-size:12px;
}

.digitBox b{
  display:block;
  margin-top:5px;
  font-size:16px;
}

/* SIGNALS */
.signalGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.signal{
  background:#071521;
  border-radius:12px;
  border:1px solid #193b53;
  padding:14px;
  text-align:center;
}

.signal b{
  display:block;
  margin-top:7px;
  font-size:19px;
  color:#40c5ff;
}

/* TABLE */
.tableWrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  padding:10px;
  border-bottom:1px solid #193448;
  text-align:center;
  font-size:13px;
}

th{
  color:#62c4ff;
}

.badge{
  padding:4px 8px;
  background:#123c59;
  border-radius:7px;
}

/* NOTICE */
.notice{
  color:#9db8ca;
  font-size:12px;
  line-height:1.5;
  margin-top:12px;
}

/* FOOTER */
footer{
  text-align:center;
  color:#607f94;
  padding:22px 0;
  font-size:12px;
}

/* MOBILE */
@media(max-width:700px){

  .header h1{
    font-size:23px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .signalGrid{
    grid-template-columns:1fr 1fr;
  }

  .digits{
    grid-template-columns:repeat(5,1fr);
  }

  .buttons{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BY KA EUNY PRO BOT</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#07324a 0%,#020711 45%,#010409 100%);color:#fff}
.container{width:96%;max-width:900px;margin:15px auto}
.card{background:rgba(4,13,27,.94);border:2px solid #00d9ff;border-radius:20px;padding:18px;margin-bottom:15px;box-shadow:0 0 20px rgba(0,217,255,.15)}
h1{text-align:center;font-size:22px;margin:5px 0;color:#00d9ff;text-shadow:0 0 10px #00d9ff}
.subtitle{text-align:center;color:#8ed9eb;font-size:12px;margin-bottom:12px}
.status{display:flex;justify-content:center;align-items:center;gap:8px;font-weight:bold;margin:8px 0}
.dot{width:12px;height:12px;border-radius:50%;background:#ff4757}.dot.live{background:#00ff88;box-shadow:0 0 10px #00ff88}
select,input{background:#001a33;border:1px solid #00d9ff;color:#fff;padding:12px;border-radius:10px;width:100%;margin:6px 0;font-size:14px}
.label{color:#8ed9eb;font-size:12px;margin-top:8px}
.box{background:#000d1a;border:1px solid #00d9ff;border-radius:12px;padding:15px;text-align:center;margin:8px 0}
.big-digit{font-size:45px;font-weight:bold;color:#00d9ff;text-shadow:0 0 15px #00d9ff}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.digit-box{background:#000d1a;border:1px solid #00d9ff;border-radius:8px;padding:8px;text-align:center;font-size:12px}
.digit-box.active{border-color:#00ff88;box-shadow:0 0 10px #00ff88}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-card{background:#000d1a;border:1px solid #00d9ff;border-radius:10px;padding:12px;text-align:center}
.stat-card .title{font-size:11px;color:#8ed9eb}
.stat-card .value{font-size:18px;font-weight:bold;color:#ffd700;margin-top:4px}
.evenodd{display:flex;gap:10px}
.btn{background:linear-gradient(90deg,#00d9ff,#007bff);border:none;color:#000;padding:14px;border-radius:12px;width:100%;font-weight:bold;font-size:15px;cursor:pointer;margin-top:10px}
</style>
</head>
<body>
<div class="container">

  <div class="card">
    <h1>👑 BY KA EUNY PRO BOT 👑</h1>
    <p class="subtitle">Full Live Deriv Analysis</p>
    <div class="status"><div class="dot" id="statusDot"></div><span id="statusText">Disconnected</span></div>
  </div>

  <div class="card">
    <div class="label">API TOKEN</div>
    <input id="token" type="password" placeholder="Weka API Token yako">
    <div class="label">SELECT VOLATILITY</div>
    <select id="symbol">
      <option value="R_10">Volatility 10 Index</option>
      <option value="R_25">Volatility 25 Index</option>
      <option value="R_50">Volatility 50 Index</option>
      <option value="R_75">Volatility 75 Index</option>
      <option value="R_100">Volatility 100 Index</option>
      <option value="RDBULL">Bull Market</option>
      <option value="RDBEAR">Bear Market</option>
    </select>
    <button class="btn" onclick="connect()">🔑 CONNECT LIVE</button>
  </div>

  <div class="card">
    <div class="box">
      <div style="color:#8ed9eb">LAST LIVE DIGIT</div>
      <div class="big-digit" id="lastDigit">-</div>
    </div>
  </div>

  <div class="card">
    <div class="label">MOST POWERFUL ANALYSIS</div>
    <div class="stats-grid">
      <div class="stat-card"><div class="title">POWER DIGIT</div><div class="value" id="powerDigit">-</div></div>
      <div class="stat-card"><div class="title">EVEN</div><div class="value" id="evenPercent">0%</div></div>
      <div class="stat-card"><div class="title">ODD</div><div class="value" id="oddPercent">0%</div></div>
      <div class="stat-card"><div class="title">OVER 4</div><div class="value" id="overPercent">0%</div></div>
      <div class="stat-card"><div class="title">UNDER 5</div><div class="value" id="underPercent">0%</div></div>
      <div class="stat-card"><div class="title">MATCHES</div><div class="value" id="matchPercent">0%</div></div>
    </div>
  </div>

  <div class="card">
    <div class="label">DIGIT FREQUENCY 0-9 <span id="tickCount" style="float:right;color:#00ff88">0/100</span></div>
    <div class="grid" id="frequencyGrid"></div>
  </div>

</div>

<script>
const APP_ID = "346Fu3sx0dtDikmKRP1S5";
let ws;
let digits = [];
let lastDigit = null;

function connect(){
  const token = document.getElementById('token').value;
  if(!token) return alert("Weka API Token kwanza!");
  
  ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);
  
  ws.onopen = () => {
    ws.send(JSON.stringify({authorize: token}));
  };
  
  ws.onmessage = (msg) => {
    const data = JSON.parse(msg.data);
    if(data.error) return alert("Error: " + data.error.message);
    
    if(data.authorize){
      document.getElementById('statusDot').classList.add('live');
      document.getElementById('statusText').innerText = "LIVE";
      ws.send(JSON.stringify({ticks: document.getElementById('symbol').value, subscribe: 1}));
    }
    
    if(data.tick){
      const digit = parseInt(data.tick.quote.toString().slice(-1));
      digits.push(digit);
      if(digits.length > 100) digits.shift();
      updateAll(digit);
      lastDigit = digit;

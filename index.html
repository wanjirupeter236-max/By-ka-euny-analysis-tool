<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BY KA EUNY Analysis Tool</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: #1d1d1d;
      padding: 25px;
      border-radius: 15px;
    }

    h1 {
      margin-bottom: 10px;
    }

    input, button {
      width: 90%;
      padding: 14px;
      margin: 8px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    button {
      background: #00c853;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>BY KA EUNY</h1>
    <h2>Analysis Tool</h2>

    <p>Enter the last digit:</p>

    <input id="digit" type="number" min="0" max="9" placeholder="0 - 9">

    <button onclick="analyze()">ANALYZE</button>

    <div id="result"></div>
  </div>

  <script>
    function analyze() {
      const digit = Number(document.getElementById("digit").value);
      const result = document.getElementById("result");

      if (isNaN(digit) || digit < 0 || digit > 9) {
        result.innerHTML = "Enter a digit from 0 to 9";
        return;
      }

      if (digit >= 5) {
        result.innerHTML = "OVER";
      } else {
        result.innerHTML = "UNDER";
      }
    }
  </script>
</body>
</html>

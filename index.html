<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BY KA EUNY LIVE DERIV ANALYSIS</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background: radial-gradient(circle at top,#07324a 0%,#020711 45%,#010409 100%);
  color:#fff;
}
.container{width:94%;max-width:850px;margin:18px auto}
.card{background:rgba(4,13,27,.94);border:2px solid #00d9ff;border-radius:26px;padding:22px;margin-bottom:18px;box-shadow:0 0 25px rgba(0,217,255,.12)}
h1{text-align:center;font-size:25px;margin:4px 0 8px;color:#00d9ff;text-shadow:0 0 10px #00d9ff}
.subtitle{text-align:center;color:#8ed9eb;font-size:13px;margin-bottom:18px}
.status{display:flex;justify-content:center;align-items:center;gap:8px;font-weight:bold;margin:10px 0 18px;font-size:16px}
.dot{width:12px;height:12px;border-radius:50%;background:#ff4757;box-shadow:0 0 10px #ff4757}
.dot.live{background:#00ff88;box-shadow:0 0 10px #00ff88}
select,input{background:#001a33;border:1px solid #00d9ff;color:#fff;padding:12px;border-radius:10px;width:100%;margin:8px 0;font-size:15px}
.label{color:#8ed9eb;font-size:13px;margin-top:10px}
.box{background:#000d1a;border:1px solid #00d9ff;border-radius:15px;padding:20px;text-align:center;margin:10px 0}
.big-digit{font-size:60px;font-weight:bold;color:#00d9ff;margin:10px 0;text-shadow:0 0 15px #00d9ff}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.digit-box{background:#000d1a;border:1px solid #00d9ff;border-radius:10px;padding:10px;text-align:center;transition:0.3s}
.digit-box.active{border-color:#00ff88;box-shadow:0 0 15px #00ff88;background:#001a33}
.digit-box.num{font-size:28px;font-weight:bold}
.digit-box.stats{font-size:11px;color:#8ed9eb}
.btn{background:linear-gradient(90deg,#00d9ff,#007bff);border:none;color:#000;padding:14px;border-radius:12px;width:100%;font-weight:bold;font-size:16px;cursor:pointer;margin-top:10px}
.btn:hover{box-shadow:0 0 20px #00d9ff}
</style>
</head>
<body>
<div class="container">

  <div class="card">
    <h1>👑 BY KA EUNY LIVE DERIV ANALYSIS 👑</h1>
    <p class="subtitle">Live Digits Analysis Tool - Volatility</p>
    <div class="status">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">Disconnected</span>
    </div>
  </div>

  <div class="card">
    <div class="label">API TOKEN</div>
    <input id="token" type="password" placeholder="Weka API Token yako">
    <div class="label">SELECT VOLATILITY</div>
    <select id="symbol">
      <option value="R_10">Volatility 10 Index</option>
      <option value="R_25">Volatility 25 Index</option>
      <option value="R_50">Volatility 50 Index</option>
      <option value="R_75">Volatility 75 Index</option>
      <option value="R_100">Volatility 100 Index</option>
    </select>
    <button class="btn" onclick="connect()">🔑 CONNECT LIVE</button>
  </div>

  <div class="card">
    <div class="box">
      <div style="color:#8ed9eb">LAST LIVE DIGIT</div>
      <div class="big-digit" id="lastDigit">-</div>
    </div>
    <div class="box" style="border-color:#ffd700">
      <div style="color:#ffd700">MOST POWERFUL DIGIT</div>
      <div class="big-digit" id="powerDigit" style="color:#ffd700">-</div>
      <div id="powerPercent" style="color:#ffd700">0%</div>
    </div>
  </div>

  <div class="card">
    <div class="label">LIVE DIGIT FREQUENCY 0 - 9 <span id="tickCount" style="float:right;color:#00ff88">0/100 ticks</span></div>
    <div class="grid" id="frequencyGrid"></div>
  </div>

</div>

<script>
const APP_ID = "346Fu3sx0dtDikmKRP1S5";
let ws;
let digits = [];

function connect(){
  const token = document.getElementById('token').value;
  if(!token) return alert("Weka API Token kwanza!");

  document.getElementById('statusText').innerText = "Connecting...";

  ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);

  ws.onopen = () => {
    ws.send(JSON.stringify({authorize: token}));
  };

  ws.onmessage = (msg) => {
    const data = JSON.parse(msg.data);

    if(data.error){
      alert("Error: " + data.error.message);
      return;
    }

    if(data.authorize){
      document.getElementById('statusDot').classList.add('live');
      document.getElementById('statusText').innerText = "LIVE CONNECTED";
      // Subscribe ticks
      ws.send(JSON.stringify({
        ticks: document.getElementById('symbol').value,
        subscribe: 1
      }));
    }

    if(data.tick){
      const digit = parseInt(data.tick.quote.toString().slice(-1));
      digits.push(digit);
      if(digits.length > 100) digits.shift(); // Weka 100 ticks tu
      updateUI(digit);
    }
  };

  ws.onclose = () => {
    document.getElementById('statusDot').classList.remove('live');
    document.getElementById('statusText').innerText = "Disconnected";
  };
}

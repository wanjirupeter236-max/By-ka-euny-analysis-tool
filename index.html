<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BY KA EUNY Analysis Tool</title>
<style>
body{background:#0f172a;color:#e2e8f0;font-family:'Arial Black',Arial;text-align:center;padding:20px}
h1{color:#38bdf8;text-shadow:0 0 10px #38bdf8}
.card{background:#1e293b;padding:20px;border-radius:12px;margin:20px auto;max-width:400px;border:2px solid #38bdf8}
.signal{font-size:32px;font-weight:bold;padding:15px;border-radius:8px;margin:10px 0;text-shadow:0 0 5px black}
.BUY{background:#16a34a;box-shadow:0 0 15px #16a34a}
.SELL{background:#dc2626;box-shadow:0 0 15px #dc2626}
.WAIT{background:#64748b}
.logo{width:200px;border-radius:20px;margin-bottom:15px;border:3px solid gold;box-shadow:0 0 20px gold}
</style>
</head>
<body>
<img src="logo.png" class="logo" alt="KA EUNY TRADER">
<h1>BY KA EUNY ANALYSIS TOOL</h1>
<div class="card">
<h3>Volatility 75 Index - 1M</h3>
<div id="status">Connecting...</div>
<div id="signal" class="signal WAIT">WAIT</div>
<p>RSI: <span id="rsi">--</span> | Price: <span id="price">--</span></p>
</div>
<script>
const APP_ID='1089';
let ws;let candles=[];
ws=new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);
ws.onopen=()=>{ws.send(JSON.stringify({ticks:"R_75",subscribe:1}));document.getElementById('status').innerText='Connected!'};
ws.onerror=()=>{document.getElementById('status').innerText='Connection Failed. Refresh'};
ws.onmessage=(msg)=>{const data=JSON.parse(msg.data);
if(data.tick){const price=parseFloat(data.tick.quote);document.getElementById('price').innerText=price.toFixed(2);
candles.push(price);if(candles.length>14)candles.shift();if(candles.length>=14){const rsi=calcRSI(candles);
document.getElementById('rsi').innerText=rsi.toFixed(2);const s=document.getElementById('signal');
if(rsi<30){s.className='signal BUY';s.innerText='BUY'}else if(rsi>70){s.className='signal SELL';s.innerText='SELL'}
else{s.className='signal WAIT';s.innerText='WAIT'}}}}};
function calcRSI(p){let g=0,l=0;for(let i=1;i<p.length;i++){const d=p[i]-p[i-1];if(d>0)g+=d;else l-=d}const rs=g/(l||1);return 100-(100/(1+rs))}
</script>
</body>
</html>

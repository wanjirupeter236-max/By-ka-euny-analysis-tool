<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BY KA EUNY ANALYSIS TOOL</title>
<style>
body{font-family:Arial, sans-serif; background:#0f172a; color:#fff; text-align:center; padding:20px}
.card{background:#182033; border-radius:15px; padding:20px; margin:10px auto; max-width:400px}
h1{color:#38bdf8}
.signal{font-size:28px; font-weight:bold; padding:20px; border-radius:10px; margin-top:15px}
.BUY{background:#16a34a}
.SELL{background:#dc2626}
.WAIT{background:#64748b}
</style>
</head>
<body>
<h1>BY KA EUNY ANALYSIS TOOL</h1>
<div class="card">
  <h3>Volatility 75 Index - 1M</h3>
  <div id="status">Connecting to Deriv...</div>
  <div id="signal" class="signal WAIT">WAITING</div>
  <p>RSI: <span id="rsi">--</span> | EMA50: <span id="ema50">--</span></p>
</div>

<script>
const ws = new WebSocket("wss://ws.binaryws.com/websockets/v3?app_id=1089");
let candles = [];

ws.onopen = () => {
  document.getElementById("status").innerText = "Connected. Loading candles...";
  ws.send(JSON.stringify({ticks_history: "R_75", count: 200, granularity: 60, style: "candles"}));
};

ws.onmessage = (msg) => {
  const data = JSON.parse(msg.data);
  if(data.msg_type === "history"){
    candles = data.history.candles;
    document.getElementById("status").innerText = "Live";
    calculate();
  }
};

function rsi(data, period=14){
  let gains=0, losses=0;
  for(let i=1; i<=period; i++){
    let diff = data[i] - data[i-1];
    if(diff>0) gains+=diff; else losses-=diff;
  }
  if(losses === 0) return 100;
  let rs = gains/losses;
  return 100 - (100/(1+rs));
}

function ema(data, period){
  let k = 2/(period+1);
  let ema = data[0];
  for(let i=1; i<data.length; i++) ema = data[i]*k + ema*(1-k);
  return ema;
}

function calculate(){
  let closes = candles.map(c=>c.close);
  let rsiVal = rsi(closes, 14).toFixed(2);
  let ema50Val = ema(closes, 50).toFixed(2);
  let lastPrice = closes[closes.length-1];

  document.getElementById("rsi").innerText = rsiVal;
  document.getElementById("ema50").innerText = ema50Val;

  let signalBox = document.getElementById("signal");
  if(rsiVal < 30 && lastPrice > ema50Val){
    signalBox.className = "signal BUY";
    signalBox.innerText = "BUY SIGNAL";
  } else if(rsiVal > 70 && lastPrice < ema50Val){
    signalBox.className = "signal SELL"; 
    signalBox.innerText = "SELL SIGNAL";
  } else {
    signalBox.className = "signal WAIT";
    signalBox.innerText = "WAIT";
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BY KA EUNY Analysis Tool</title>
</head>

<body>

  <h1>BY KA EUNY Analysis Tool</h1>

  <h2>🤖 AUTO RUN</h2>

  <label>Contract Type:</label>
  <select id="contract">
    <option value="over">OVER</option>
    <option value="under">UNDER</option>
    <option value="even">EVEN</option>
    <option value="odd">ODD</option>
    <option value="match">MATCH</option>
    <option value="diff">DIFF</option>
  </select>

  <br><br>

  <label>Choose Digit:</label>
  <select id="digit">
    <option value="0">0</option>
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3" selected>3</option>
    <option value="4">4</option>
    <option value="5">5</option>
    <option value="6">6</option>
    <option value="7">7</option>
    <option value="8">8</option>
    <option value="9">9</option>
  </select>

  <br><br>

  <button onclick="runBot()">▶ RUN — FIND BEST MARKET</button>
  <button onclick="stopBot()">■ STOP</button>

  <h3 id="status">IDLE</h3>

  <hr>

  <h2>📊 Selected Market</h2>
  <p>Market: <b id="market">—</b></p>
  <p>RSI: <b id="rsi">—</b></p>
  <p>Last Digit: <b id="lastDigit">—</b></p>
  <p>Score: <b id="score">—</b></p>

  <hr>

  <h2>📈 Demo Results</h2>
  <p>Runs: <b id="runs">0</b></p>
  <p>Wins: <b id="wins">0</b></p>
  <p>Losses: <b id="losses">0</b></p>

<script>

let running = false;
let runs = 0;
let wins = 0;
let losses = 0;

/*
  CONTRACT SETTINGS

  OVER 3  = digits 4-9
  UNDER 7 = digits 0-6
  EVEN    = 0,2,4,6,8
  ODD     = 1,3,5,7,9
  MATCH   = selected digit
  DIFF    = anything except selected digit
*/

function checkContract(digit) {

  const type = document.getElementById("contract").value;
  const target = Number(document.getElementById("digit").value);

  if (type === "over") {
    return digit > target;
  }

  if (type === "under") {
    return digit < target;
  }

  if (type === "even") {
    return digit % 2 === 0;
  }

  if (type === "odd") {
    return digit % 2 !== 0;
  }

  if (type === "match") {
    return digit === target;
  }

  if (type === "diff") {
    return digit !== target;
  }

  return false;
}


function runBot() {

  if (running) return;

  running = true;

  document.getElementById("status").innerText =
    "🔎 SEARCHING FOR BEST MARKET...";

  /*
    Hapa ndipo live Deriv WebSocket
    itaunganishwa na market scanner.
    
    Scanner itachagua:
    - Volatility market
    - RSI
    - Last digit
    - Digit frequency
    - Market score
  */

  setTimeout(() => {

    if (!running) return;

    document.getElementById("market").innerText =
      "AUTO SELECT";

    document.getElementById("rsi").innerText =
      "Scanning...";

    document.getElementById("score").innerText =
      "Scanning...";

    document.getElementById("status").innerText =
      "🤖 DEMO BOT RUNNING";

    /*
      Demo simulation.
      Real Deriv contracts zinahitaji
      WebSocket + authorized trading API.
    */

    demoTrade();

  }, 2000);
}


function demoTrade() {

  if (!running) return;

  const digit = Math.floor(Math.random() * 10);

  document.getElementById("lastDigit").innerText = digit;

  const result = checkContract(digit);

  runs++;

  if (result) {
    wins++;
  } else {
    losses++;
  }

  document.getElementById("runs").innerText = runs;
  document.getElementById("wins").innerText = wins;
  document.getElementById("losses").innerText = losses;

  if (running) {
    setTimeout(demoTrade, 3000);
  }
}


function stopBot() {

  running = false;

  document.getElementById("status").innerText =
    "⛔ BOT STOPPED";
}

</script>

</body>
</html>

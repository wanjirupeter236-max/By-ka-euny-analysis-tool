<!DOCTYPE html>
<html>
<head>
    <title>Deriv API Example</title>
</head>
<body>
    <h1>Deriv API WebSocket Example</h1>
    <div id="status">Connecting...</div>
    <div id="output"></div>

    <script>
        const ws = new WebSocket('wss://ws.binaryws.com/websockets/v3');
        const statusDiv = document.getElementById('status');
        const outputDiv = document.getElementById('output');

        ws.onopen = () => {
            statusDiv.textContent = 'Connected';
            
            // Get active symbols (no auth required)
            ws.send(JSON.stringify({
                active_symbols: 'brief',
                product_type: 'basic',
                req_id: 1
            }));
            
            // Subscribe to tick stream
            ws.send(JSON.stringify({
                ticks: '1HZ100V',
                subscribe: 1,
                req_id: 2
            }));
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            if (data.msg_type === 'active_symbols') {
                outputDiv.innerHTML += '<h3>Active Symbols:</h3>';
                data.active_symbols.forEach(symbol => {
                    outputDiv.innerHTML += `<p>${symbol.display_name} (${symbol.symbol})</p>`;
                });
            }
            
            if (data.msg_type === 'tick') {
                outputDiv.innerHTML += `<p>Tick: ${data.tick.quote} at ${new Date(data.tick.epoch * 1000).toLocaleTimeString()}</p>`;
            }
        };

        ws.onerror = (error) => {
            statusDiv.textContent = 'Error: ' + error.message;
        };

        ws.onclose = () => {
            statusDiv.textContent = 'Disconnected';
        };
    </script>
</body>
</html>

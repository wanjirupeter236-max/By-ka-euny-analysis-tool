<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BY KA EUNY Live RSI</title>
<style>
body{margin:0;background:#020617;color:white;font-family:Arial;padding:15px}
.box{max-width:900px;margin:auto}
header{padding:25px;text-align:center;border:1px solid #087cff;border-radius:20px;background:#071a3d}
.logo{font-size:45px;color:#ffd43b;font-weight:bold}
h1{color:#ffd43b}
.card{background:#07111f;border:1px solid #087cff;border-radius:15px;padding:15px;margin:15px 0}
select{width:100%;padding:14px;background:#020617;color:white;border:1px solid #087cff;border-radius:10px}
.signal{text-align:center;font-size:32px;font-weight:bold;padding:25px}
.green{color:#00ff80}.red{color:#ff526d}.yellow{color:#ffd43b}
table{width:100%;border-collapse:collapse}
td,th{padding:10px;border-bottom:1px solid #1d3555;text-align:left}
#status{color:#00ff80}
</style>
</head>

<body>
<div class="box">

<header>
<div class="logo">👑 KE</div>
<h1>BY KA EUNY</h1>
<p>LIVE DERIV VOLATILITY • RSI • DIGITS</p>
<p id="status">● Connecting...</p>
</header>

<div class="card">
<h3>SELECT VOLATILITY</h3>
<select id="market">
<option>Loading...</option>
</select>
</div>

<div class="card">
<h3>LIVE ANALYSIS</h3>
<div>Price: <b id="price">--</b></div>
<div>Last Digit: <b id="digit">--</b></div>
<div>RSI(14): <b id="rsi">--</b></div>
<div id="signal" class="signal yellow">WAITING</div>
</div>

<div class="card">
<h3>ALL VOLATILITY MARKETS</h3>
<table>
<thead>
<tr>
<th>Market</th>
<th>Price</th>
<th>Digit</th>
<th>RSI</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>
</div>

<div class="card">
<h3>LIVE DIGITS</h3>
<div id="digits">Waiting for live data...</div>
</div>

</div>

<script>
let ws;
let markets=[];
let data={};
let selected="";

function connect(){

ws=new WebSocket(
"wss://ws.binaryws.com/websockets/v3"
);

ws.onopen=function(){

document.getElementById("status").innerText=
"● CONNECTED — LIVE DERIV";

ws.send(JSON.stringify({
active_symbols:"brief",
product_type:"basic"
}));

};

ws.onmessage=function(e){

let x=JSON.parse(e.data);

if(x.msg_type==="active_symbols"){

markets=x.active_symbols.filter(s=>
(s.display_name||"")
.toLowerCase()
.includes("volatility")
);

let select=document.getElementById("market");

select.innerHTML="";

markets.forEach((m,i)=>{

let sym=m.symbol;

data[sym]={
name:m.display_name,
prices:[],
price:"--",
digit:"--",
rsi:"--"
};

let option=document.createElement("option");

option.value=sym;
option.textContent=m.display_name;

select.appendChild(option);

if(i===0)selected=sym;

});

select.value=selected;

select.onchange=function(){
selected=this.value;
showSelected();
};

markets.forEach(m=>{

let sym=m.symbol;

ws.send(JSON.stringify({
ticks:sym,
subscribe:1
}));

});

render();

}

if(x.msg_type==="tick"){

let sym=x.tick.symbol;

if(!data[sym])return;

let price=Number(x.tick.quote);

data[sym].price=price;

data[sym].prices.push(price);

if(data[sym].prices.length>100)
data[sym].prices.shift();

let text=String(price);

data[sym].digit=
text.replace(/[^0-9]/g,"").slice(-1);

data[sym].rsi=
calcRSI(data[sym].prices,14);

render();

showSelected();

}

};

ws.onclose=function(){

document.getElementById("status").innerText=
"● Disconnected — reconnecting...";

setTimeout(connect,3000);

};

}

function calcRSI(p,n){

if(p.length<n+1)return "--";

let gain=0;
let loss=0;

for(let i=p.length-n;i<p.length;i++){

let change=p[i]-p[i-1];

if(change>0)
gain+=change;
else
loss-=change;

}

if(loss===0)return 100;

return (
100-
(100/(1+(gain/loss)))
).toFixed(2);

}

function getSignal(rsi){

if(rsi==="--")
return ["WAIT","yellow"];

if(rsi<=30)
return ["OVERSOLD","green"];

if(rsi>=70)
return ["OVERBOUGHT","red"];

return ["NEUTRAL","yellow"];

}

function render(){

let html="";

markets.forEach(m=>{

let d=data[m.symbol];

if(!d)return;

html+=`
<tr>
<td>${d.name}</td>
<td>${d.price}</td>
<td>${d.digit}</td>
<td>${d.rsi}</td>
</tr>
`;

});

document.getElementById("list").innerHTML=html;

}

function showSelected(){

let d=data[selected];

if(!d)return;

document.getElementById("price").innerText=d.price;
document.getElementById("digit").innerText=d.digit;
document.getElementById("rsi").innerText=d.rsi;

let s=getSignal(d.rsi);

let el=document.getElementById("signal");

el.innerText=s[0];
el.className="signal "+s[1];

let digits="";

for(let i=0;i<=9;i++){

let active=
String(d.digit)===String(i);

digits+=`
<span style="
display:inline-block;
padding:12px;
margin:4px;
border-radius:10px;
background:${active?"#00aaff":"#111c2e"};
font-weight:bold">
${i}
</span>`;

}

document.getElementById("digits").innerHTML=digits;

}

connect();

</script>

</body>
</html>scs
